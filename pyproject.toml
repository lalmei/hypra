[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypra"
version = "0.1.0a0"
description = "Native exact hypergeometric epsilon expansions in SymPy, inspired by HypExp2"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "sympy>=1.13,<2",
 "mpmath>=1.3,<2",
 "typer>=0.16,<0.17",
]

[project.scripts]
hypra = "hypra.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]
quality = [
    "pyright==1.1.414",
    "ruff==0.17.5",
]
docs = [
    "properdocs==1.6.7",
    "mkdocs-materialx==10.2.2",
    "mkdocs-mermaid2-plugin==1.2.3",
    "mkdocs-typer2[mkdocs]==0.4.1",
    "mkdocstrings-python==2.0.11",
]

[tool.pyright]
include = ["src/hypra"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_backend: requires licensed Wolfram plus external HypExp/HPL (opt in)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
default-groups = ["dev", "docs"]
