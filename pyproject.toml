[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypra"
version = "0.2.0"
description = "Native exact hypergeometric epsilon expansions in SymPy, inspired by HypExp2"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "sympy>=1.13,<2",
 "mpmath>=1.3,<2",
 "typer>=0.16,<0.17",
]

[project.scripts]
hypra = "hypra.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.0.0",
    "ruff>=0.8",
]
quality = [
    "pyright==1.1.414",
    "ruff==0.17.5",
]
docs = [
    "properdocs==1.6.7",
    "mkdocs-materialx==10.2.2",
    "mkdocs-mermaid2-plugin==1.2.3",
    "mkdocs-typer2[mkdocs]==0.4.1",
    "mkdocstrings-python==2.0.11",
]

[tool.pyright]
include = ["src/hypra"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_backend: requires licensed Wolfram plus external HypExp/HPL (opt in)"]
addopts = "--cov --cov-report=term-missing --cov-report=xml --cov-report=html"

[tool.coverage.run]
branch = true
source = ["src/hypra"]
relative_files = true

[tool.coverage.report]
precision = 2

[tool.coverage.html]
title = "Hypra Coverage Report"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
default-groups = ["dev", "docs"]

[tool.bumpversion]
parse = '^(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(?:(?P<stage>a|b|rc)(?P<pre>\d+))?$'
serialize = ["{major}.{minor}.{patch}{stage}{pre}", "{major}.{minor}.{patch}"]
commit = false
tag = false

[tool.bumpversion.parts.stage]
values = ["a", "b", "rc", "final"]
first_value = "a"
optional_value = "final"

[[tool.bumpversion.files]]
filename = "src/hypra/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/hypra/api.py"
search = '"hypra_version": "{current_version}"'
replace = '"hypra_version": "{new_version}"'
