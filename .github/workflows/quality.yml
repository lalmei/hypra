name: Python quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.15'
          enable-cache: true
      - name: Install locked quality tools
        run: uv sync --locked --no-default-groups --group quality
      - name: Check formatting
        run: uv run --no-sync ruff format --check src tests examples scripts
      - name: Check lint
        run: uv run --no-sync ruff check .
      - name: Check types
        run: uv run --no-sync pyright --pythonpath .venv/bin/python
