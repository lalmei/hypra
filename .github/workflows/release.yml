name: Validate and manually publish Python release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the selected version tag to production PyPI (requires protected pypi environment approval)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Verify version tag
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as stream:
              version = tomllib.load(stream)['project']['version']
          if os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Tag must exactly match v + project.version')
          PY
      - run: uv sync --locked --no-default-groups --group dev
      - run: uv run --no-sync pytest -q -m 'not real_backend'
      - name: Build wheel and source distribution
        run: uv build --out-dir dist
      - name: Validate package metadata
        run: uvx --from twine==7.0.0 twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publication-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require version tag and existing reviewer-protected environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_TYPE" = tag || { echo 'Select a version tag, not a branch'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/environments/pypi" > environment.json
          python - <<'PY'
          import json
          with open('environment.json') as stream:
              environment = json.load(stream)
          rules = environment.get('protection_rules', [])
          if not any(r.get('type') == 'required_reviewers' and r.get('reviewers') for r in rules):
              raise SystemExit('An existing pypi environment with required reviewers is mandatory')
          PY

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [validate, publication-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/hypra/
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish approved distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          skip-existing: false
          attestations: true
