name: Python checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group dev --python "${{ matrix.python-version }}"
      - name: Run the test suite
        env:
          PYTEST_ADDOPTS: ${{ matrix.python-version != '3.15' && '--no-cov' || '' }}
        run: uv run --no-sync --python "${{ matrix.python-version }}" pytest -q -m 'not real_backend'
