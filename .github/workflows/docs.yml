name: Build documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - name: Install locked documentation dependencies
        run: uv sync --locked --group docs
      - name: Build strict offline-capable documentation
        run: uv run --no-sync mkdocs build --strict
      - name: Check local rendering assets and generated reference pages
        run: uv run --no-sync python scripts/check_docs_build.py
      - name: Upload documentation for review
        uses: actions/upload-artifact@v4
        with:
          name: hypra-documentation
          path: site/
          if-no-files-found: error
          retention-days: 14
