site_name: Hypra
site_description: Native exact epsilon expansions and harmonic polylogarithms in Python
site_url: !ENV [HYPRA_SITE_URL, "http://127.0.0.1:8000/"]
use_directory_urls: true
theme:
  name: materialx
  font: false
  palette:
    scheme: default
    primary: teal
    accent: deep orange
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_signature_annotations: true
            separate_signature: true
  - mkdocs-typer2:
      engine: native
      pretty: true
  - mermaid2:
      version: 10.9.4
      javascript: assets/mermaid/mermaid.esm.min.mjs
      arguments:
        securityLevel: strict
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.arithmatex:
      generic: true
extra_css:
  - assets/katex/katex.min.css
extra_javascript:
  - assets/katex/katex.min.js
  - assets/katex/auto-render.min.js
  - assets/math.js
nav:
  - Overview: index.md
  - Start here:
      - API examples: api-examples.md
      - Python API reference: python-api.md
      - Command-line reference: cli-reference.md
      - Architecture: architecture.md
      - Setup: setup.md
      - Capabilities and limits: scope.md
      - Roadmap: roadmap.md
      - Native parity map: parity-map.md
  - Mathematical Background:
      - Epsilon Expansions: latex-and-docs.md
      - Mathematical derivation: mathematics.md
      - Integer parameter reductions: integer-port.md
      - Half-integer systems: half-system.md
      - Hypergeometric endpoints: endpoints.md
  - Harmonic polylogarithms:
      - Notation and formatting: hpl-notation.md
      - Nielsen polylogarithms: nielsen-polylogarithms.md
      - Numerical evaluation: hpl-numerics.md
      - Interior Taylor series: hpl-taylor.md
      - Near-one power and log series: hpl-near-one-series.md
      - Exact values at i: hpl-at-i.md
      - Radial numerical continuation: hpl-continuation.md
      - Real-cut boundary numerics: hpl-boundary-numerics.md
      - Shuffle and logarithm reduction: hpl-reduction.md
      - Classical polylogarithms: hpl-classical-binary-three.md
      - Negative-letter classical reduction: hpl-classical-negative-three.md
      - Mixed-sign classical reduction: hpl-classical-mixed-three.md
      - Complete cubic classical reduction: hpl-classical-ternary-three.md
      - Explicit shuffle regularization: hpl-regularization.md
      - Binary endpoints and MZVs: hpl-endpoints.md
      - Endpoint constant products: hpl-stuffle.md
      - Alternating endpoints and Euler sums: hpl-alternating-endpoints.md
      - Numerical endpoint constants: hpl-constant-numerics.md
      - Negation and reflection: hpl-transforms.md
      - Binary argument maps: hpl-binary-maps.md
      - Mobius transformation: hpl-mobius.md
      - Inversion: hpl-inversion.md
      - Real-region continuation: hpl-real-continuation.md
  - Reference:
      - Exact transport protocol: protocol.md
      - Upstream sources and attribution: upstream-source.md
      - Documentation maintenance: docs-maintenance.md
      - Release process: releasing.md
      - Mathematics PDF: mathematics.pdf
